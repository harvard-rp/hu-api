name: Database tests

on:
  push:
    branches: ['**']
    paths: &database_paths
      - '.github/workflows/database-tests.yml'
      - '.editorconfig'
      - '.prettierrc.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/supabase-local.mjs'
      - 'src/**'
      - 'supabase/**'
      - 'tests/**'
      - 'tsconfig.json'
  pull_request:
    paths: *database_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    name: PostgreSQL and pgTAP
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Docker
        id: docker
        run: docker info --format 'Docker server {{.ServerVersion}}'

      - name: Start local Supabase
        timeout-minutes: 15
        run: pnpm supabase:start

      - name: Check local Supabase services
        run: pnpm supabase:status

      - name: Reset local PostgreSQL
        timeout-minutes: 6
        run: pnpm supabase:reset

      - name: Run PostgreSQL and pgTAP tests
        timeout-minutes: 5
        run: pnpm test:integration

      - name: Test concurrent club reservations
        timeout-minutes: 2
        run: pnpm test:concurrency

      - name: Verify player authorization, Discord bootstrap and character workflows with local Auth
        timeout-minutes: 3
        run: pnpm test:auth:local

      - name: Generate PostgreSQL TypeScript types
        timeout-minutes: 5
        run: pnpm supabase:types

      - name: Check for generated schema drift
        run: git diff --exit-code -- src/lib/supabase/database.types.ts

      - name: Type-check the generated schema
        run: pnpm typecheck

      - name: Stop local Supabase
        if: ${{ always() && steps.docker.outcome == 'success' }}
        timeout-minutes: 2
        run: pnpm supabase:stop
